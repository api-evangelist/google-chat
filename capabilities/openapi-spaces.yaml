naftiko: 1.0.0-alpha2
info:
  label: Google Chat API — Spaces
  description: 'Google Chat API — Spaces. 2 operations. Lead operation: Google Chat List spaces. Self-contained Naftiko capability
    covering one Google Chat business surface.'
  tags:
  - Google Chat
  - Spaces
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_CHAT_API_KEY: GOOGLE_CHAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: openapi-spaces
    baseUri: https://chat.googleapis.com
    description: Google Chat API — Spaces business capability. Self-contained, no shared references.
    resources:
    - name: v1-spaces
      path: /v1/spaces
      operations:
      - name: listspaces
        method: GET
        description: Google Chat List spaces
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: pageSize
          in: query
          type: integer
        - name: pageToken
          in: query
          type: string
      - name: createspace
        method: POST
        description: Google Chat Create space
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: openapi-spaces-rest
    port: 8080
    description: REST adapter for Google Chat API — Spaces. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v1/spaces
      name: v1-spaces
      description: REST surface for v1-spaces.
      operations:
      - method: GET
        name: listspaces
        description: Google Chat List spaces
        call: openapi-spaces.listspaces
        with:
          pageSize: rest.pageSize
          pageToken: rest.pageToken
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createspace
        description: Google Chat Create space
        call: openapi-spaces.createspace
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openapi-spaces-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Chat API — Spaces. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: google-chat-list-spaces
      description: Google Chat List spaces
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openapi-spaces.listspaces
      with:
        pageSize: tools.pageSize
        pageToken: tools.pageToken
      outputParameters:
      - type: object
        mapping: $.
    - name: google-chat-create-space
      description: Google Chat Create space
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: openapi-spaces.createspace
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
