naftiko: 1.0.0-alpha2
info:
  label: Google Chat API — Messages
  description: 'Google Chat API — Messages. 2 operations. Lead operation: Google Chat List messages. Self-contained Naftiko
    capability covering one Google Chat business surface.'
  tags:
  - Google Chat
  - Messages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_CHAT_API_KEY: GOOGLE_CHAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: openapi-messages
    baseUri: https://chat.googleapis.com
    description: Google Chat API — Messages business capability. Self-contained, no shared references.
    resources:
    - name: v1-parent-messages
      path: /v1/{parent}/messages
      operations:
      - name: listmessages
        method: GET
        description: Google Chat List messages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: parent
          in: path
          type: string
          description: 'Format: spaces/{space}'
          required: true
        - name: pageSize
          in: query
          type: integer
        - name: pageToken
          in: query
          type: string
      - name: createmessage
        method: POST
        description: Google Chat Create message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: parent
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: openapi-messages-rest
    port: 8080
    description: REST adapter for Google Chat API — Messages. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v1/{parent}/messages
      name: v1-parent-messages
      description: REST surface for v1-parent-messages.
      operations:
      - method: GET
        name: listmessages
        description: Google Chat List messages
        call: openapi-messages.listmessages
        with:
          parent: rest.parent
          pageSize: rest.pageSize
          pageToken: rest.pageToken
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createmessage
        description: Google Chat Create message
        call: openapi-messages.createmessage
        with:
          parent: rest.parent
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openapi-messages-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Chat API — Messages. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: google-chat-list-messages
      description: Google Chat List messages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openapi-messages.listmessages
      with:
        parent: tools.parent
        pageSize: tools.pageSize
        pageToken: tools.pageToken
      outputParameters:
      - type: object
        mapping: $.
    - name: google-chat-create-message
      description: Google Chat Create message
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: openapi-messages.createmessage
      with:
        parent: tools.parent
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
