aid: google-chat
name: Google Chat
description: >-
  The Google Chat API enables building Chat apps that integrate with Google Chat. It provides RESTful access to manage
  Chat spaces, memberships, messages, reactions, attachments, and custom emojis. The API supports creating
  conversational bots, automating messaging workflows, and managing organizational chat resources programmatically.
